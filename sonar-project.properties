# SonarCloud config (DEFRA organisation). The scan step is live in android-ci.yml and the
# DEFRA_mmo-cr-android project and MMO_CR_SONAR_TOKEN secret now exist, so analysis uploads
# successfully. The gate enforces >=90% coverage on new code.
#
# NOTE: xmlReportPaths below is the Kover report from testDebugUnitTest (JVM) only. Coverage
# from connectedDebugAndroidTest (emulator) is NOT merged in, so Compose UI exercised only by
# instrumented tests reports as 0% here.

sonar.organization=defra
sonar.projectKey=DEFRA_mmo-cr-android
sonar.projectName=mmo-cr-android

sonar.sources=app/src/main
sonar.tests=app/src/test,app/src/androidTest
sonar.sourceEncoding=UTF-8

# Kover emits a JaCoCo-compatible XML report; koverXmlReportDebug is the debug variant.
sonar.coverage.jacoco.xmlReportPaths=app/build/reports/kover/reportDebug.xml
sonar.java.binaries=app/build/intermediates/built_in_kotlinc/debug/compileDebugKotlin/classes

# Excluded from the coverage calculation only (still fully analysed for bugs, vulnerabilities,
# code smells and duplication). These hold no testable behaviour: @Preview composables exist
# solely for Android Studio rendering and are never invoked at runtime, and Color.kt is a flat
# set of design-token constants. Leaving them in deflates new_coverage without any test being
# able to raise it. Production code must NOT be added here to dodge the gate.
sonar.coverage.exclusions=app/src/main/java/**/*Previews.kt,app/src/main/java/**/common/design/Color.kt

# sonar.junit.reportPaths is Java-only, so JUnit XML is converted to the generic format.
# Test execution is imported on long-lived branches only, never on pull requests.
sonar.testExecutionReportPaths=build/sonar/test-execution.xml

# Static-analysis findings Sonar imports natively for Kotlin.
sonar.androidLint.reportPaths=app/build/reports/lint-results-debug.xml
sonar.kotlin.detekt.reportPaths=app/build/reports/detekt/detekt.xml

# Fail the CI job if the quality gate does not pass.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
