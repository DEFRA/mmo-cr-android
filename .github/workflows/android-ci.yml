name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release_tag:
        description: "Publish release tag after CI passes"
        type: boolean
        default: false
  merge_group:

permissions:
  contents: read

# Never cancel a main run: every non-Dependabot merge to main must publish its own release tag.
concurrency:
  group: android-ci-${{ github.ref }}
  # cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    name: Lint, test, assemble
    # Runner image is pinned (not `ubuntu-latest`) for reproducibility. This pin must be bumped
    # manually before GitHub retires the image — see the runner-image deprecation notices.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Dependabot PRs carry no bump; they ship with the next release (and their merges are not tagged).
      - name: Verify version has been bumped
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: bash .github/workflows/scripts/check-version-bump.sh

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # Fastfile wiring, release logic and the app config schema guard (no secret-like or tracking keys).
      - name: Release tooling tests
        run: bundle exec ruby -e 'Dir.glob("fastlane/test/*_test.rb").sort.each { |f| require File.expand_path(f) }'

      - name: Static analysis (Fastlane)
        run: bundle exec fastlane lint

      - name: Build debug (Fastlane)
        run: bundle exec fastlane build

      - name: Run unit tests with coverage (Fastlane)
        run: bundle exec fastlane test

      - name: Convert test results for SonarCloud
        if: ${{ !cancelled() }}
        run: bash .github/workflows/scripts/junit-to-sonar-execution.sh

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kover-report
          path: app/build/reports/kover/reportDebug.xml
          retention-days: 14

      - name: Upload Sonar test-execution report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonar-test-execution
          path: build/sonar/test-execution.xml
          retention-days: 14

      - name: Upload lint/ktlint/detekt reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: static-analysis-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/ktlint
            app/build/reports/detekt
          retention-days: 14

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          SONAR_TOKEN: ${{ secrets.MMO_CR_SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: ${{ github.event_name != 'pull_request' && format('-Dsonar.branch.name={0}', github.ref_name) || '' }}

  instrumented-tests:
    name: Instrumented tests
    # Pinned runner image — bump manually before image retirement (see note on `validate`).
    runs-on: ubuntu-24.04
    needs: validate
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Set up Ruby and Fastlane
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      # /dev/kvm is not accessible to the runner user by default; without it the x86_64
      # emulator falls back to software emulation and is far too slow for CI.
      - name: Enable KVM (hardware acceleration for the emulator)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests (Compose UI + WCAG 2.2 AA semantics)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bundle exec fastlane instrumented_test

      - name: Upload instrumented test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/connected
          retention-days: 14

  # Runs last so the check is as close to the merge as possible. Must be a required status check.
  main-idle:
    name: Main idle check
    needs: [validate, instrumented-tests]
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fail if Android CI is still running on main
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WORKFLOW_FILE: android-ci.yml
        run: bash .github/workflows/scripts/check-main-idle.sh

  # Tags only — CI never starts a release; Android Release is run manually on the tag.
  # POC ONLY (ADR 0018): a manual run may tag any branch; restore the main-only check after the POC.
  release-tag:
    name: Publish release tag
    needs: [validate, instrumented-tests]
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.publish_release_tag) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Dependabot merge
        id: source
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/workflows/scripts/detect-dependabot-merge.sh

      - name: Create and push release tag
        if: ${{ steps.source.outputs.dependabot != 'true' }}
        run: bash .github/workflows/scripts/create-release-tag.sh
