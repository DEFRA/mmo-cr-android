version: 2

# Scope is deliberately limited to GitHub Actions for now. Every third-party Action in this repo is
# pinned to a full commit SHA (a DEFRA supply-chain requirement), which means updates can no longer
# arrive implicitly via a moving tag — Dependabot is what keeps those pins current. It rewrites the
# SHA and the trailing `# vX.Y.Z` comment together, so the pins stay readable.
#
# The `gradle` and `bundler` ecosystems are a deliberate follow-up, not an oversight: they need the
# version catalog and Gemfile.lock update strategy agreed first.
updates:
  - package-ecosystem: github-actions
    # `/` covers all workflows under .github/workflows plus any composite actions at the repo root.
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    labels:
      - dependencies
      - github-actions
    groups:
      # One PR per week for routine Action bumps, so reviewers assess the supply-chain change set
      # once rather than per-Action. Majors are separated because they can break workflow syntax.
      github-actions-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      github-actions-major:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
